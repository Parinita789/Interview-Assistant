description: "Near-empty plan; judge should grade Failed and flag missing build sequence + validation."
question: "Design a URL shortener for 10K req/s and 200M URLs."
rubricVersion: v2.0
kind: traditional_design

# Sparse plan → expect a low score. Range gives the LLM some wiggle room.
expectedScore:
  min: 0.0
  max: 2.0

# Note: `validation_plan_concrete` was previously asserted miss but
# now lives in the agentic_build variant only — design-only questions
# don't carry build-mode signals after the v2.0 rubric variant split.
expectedSignals:
  miss:
    - data_model_committed
  credited: []
  hit: []
  # AI-related signals: question doesn't invoke AI, so they should be skipped.
  skipped:
    - ai_strategy_explicit
