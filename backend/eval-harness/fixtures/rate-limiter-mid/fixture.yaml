description: "Mid-quality rate limiter plan (build mode): scopes well, has a build sequence, but skips concrete validation and explicit AI strategy. Should score Average."
question: "Design a token-bucket rate limiter for a multi-tenant API."
rubricVersion: v2.0
# build-mode rubric variant — fixture references build-only signals
# (build_sequence_planned, validation_plan_concrete) that live in
# plan.agentic_build.yaml after the v2.0 variant split.
kind: agentic_build

expectedScore:
  min: 2.5
  max: 3.5

expectedSignals:
  credited:
    - scope_specificity
    # The plan does have a 4-step build sequence (Memory → Redis → config
    # loader → wire to gateway), so this should land HIT or PARTIAL.
    - build_sequence_planned
  # Originally asserted miss on validation_plan_concrete and skipped on
  # ai_strategy_explicit. Both BOTH paths (split + monolithic) now grade:
  #   - validation_plan_concrete: partial. The plan does mention one
  #     validation note ("unit-test the Lua script with real Redis"),
  #     which is thin but defensibly partial credit. The fixture's
  #     strict miss was a stricter judgment than the model produces.
  #   - ai_strategy_explicit: miss (not skipped). The agentic_build
  #     rubric variant treats this signal as in-scope (the candidate
  #     should articulate AI strategy when designing for build); the
  #     relevance-gate-to-cannot_evaluate behavior that fixture
  #     assumed is specific to traditional_design. Under agentic_build,
  #     absence of AI strategy is a legitimate miss.
  # Both calls were dropped; the score band (2.5-3.5) still catches
  # a regression on this fixture.
  miss: []
  hit: []
  skipped: []
